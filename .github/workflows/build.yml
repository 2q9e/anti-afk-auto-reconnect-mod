name: Build Fabric projects

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build all supported versions
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Verify supported 26.1 patch baselines
        run: |
          ./gradlew :versions:26.1:build --no-daemon -Pminecraft_version=26.1 -Pfabric_api_version=0.145.1+26.1
          ./gradlew :versions:26.1:build --no-daemon -Pminecraft_version=26.1.1 -Pfabric_api_version=0.145.4+26.1.1
          ./gradlew :versions:26.1:build --no-daemon -Pminecraft_version=26.1.2 -Pfabric_api_version=0.155.3+26.1.2
